/* ------------------------------------------------------------------ render */
/* ---- phone keyboard
   On a phone, closing the keyboard (Back button, or the keyboard's own hide key) leaves the
   cursor in the box. Any redraw would then put the cursor back and the keyboard would jump up
   again. So: the moment the keyboard goes down, let go of the box (redraws then have nothing to
   put the cursor back into). If a phone doesn't report its keyboard, nothing changes. */
const touchUI=matchMedia('(pointer: coarse)').matches;
let vvFull=window.visualViewport?visualViewport.height:0, vvW=window.innerWidth;
function keyboardOpen(){
  const vv=window.visualViewport;if(!vv)return true;
  return vv.height<vvFull-120;
}
if(window.visualViewport){
  let wasOpen=false;
  visualViewport.addEventListener('resize',()=>{
    if(window.innerWidth!==vvW){vvW=window.innerWidth;vvFull=visualViewport.height;wasOpen=false;return} // rotated
    if(visualViewport.height>vvFull)vvFull=visualViewport.height;
    const open=keyboardOpen();
    if(wasOpen&&!open&&touchUI){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='date')a.blur()}
    wasOpen=open;
  });
}
function render(){
  const ae=document.activeElement, key=ae&&ae.dataset?ae.dataset.k:null, y=window.scrollY;
  /* A date box is in use (its calendar may be open): redrawing would close the calendar.
     Wait until it's done — the change is already saved in ui/state, only the screen waits. */
  if(ae&&ae.type==='date'&&ae.isConnected){clearTimeout(render._wait);render._wait=setTimeout(render,600);return}
  /* A background sync can re-render while someone is mid-way through typing. Keep exactly
     what they typed and where the cursor was, instead of resetting or selecting it. */
  let typed=null;
  if(key&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.type!=='date'){
    let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
    typed={v:ae.value,ss,se};
  }
  const keepBk=$('#bk')?$('#bk').value:null;
  /* Boxes not tied to saved data (a new category's name, its amount…) keep what was typed. */
  const kept={};document.querySelectorAll('[data-keep]').forEach(x=>{if(x.id&&x.value)kept[x.id]=x.value});
  const th=getTheme();
  if(th)document.documentElement.dataset.theme=th;else document.documentElement.removeAttribute('data-theme');
  const footNote=!storageOk?'Saving is switched off in this browser. Use Setup to create a backup.':sync.url?'Shared live with your wife via Google Sheets.':'Your figures live in this browser only. Set up sharing in Setup to sync with your wife.';
  if(sync.need&&sync.url){$('#app').innerHTML=lockScreen()}
  else $('#app').innerHTML=header()+`<main class="wrap">${view()}</main><footer class="foot">${footNote}</footer>`+fab()+modalHtml()+toastHtml();
  if(keepBk!==null&&$('#bk')&&ui.backup==='paste')$('#bk').value=keepBk;
  Object.keys(kept).forEach(id=>{const x=document.getElementById(id);if(x&&!x.value)x.value=kept[id]});
  if(key){const el=document.querySelector(`[data-k="${key}"]`);if(el){
    if(typed&&el.value!==typed.v)el.value=typed.v;
    el.focus({preventScroll:true});
    try{if(typed&&typed.ss!==null)el.setSelectionRange(typed.ss,typed.se)}catch(e){}
  }}
  else if(ui.modal&&ui.modal._fresh){delete ui.modal._fresh;const af=$('#lm-amount');if(af){af.focus();try{af.select()}catch(e){}}}
  window.scrollTo(0,y);
}
const later=()=>setTimeout(render,0);

function setActual(id,m,v){const yr=yd(),a=yr.actuals[id]||(yr.actuals[id]=Array(12).fill(null));a[m]=v===null?null:Math.max(0,v)}
function onChange(e){
  const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;
  const v=parseNum(t.value),d=t.dataset;
  if(['income1','pyfPct','splitPyf','splitExtra','planned','linePct'].indexOf(act)>=0)beforePlanChange();
  switch(act){
    case 'month':ui.month=+t.value;break;
    case 'year':{ui.year=+t.value;const now=new Date();if(ui.year===now.getFullYear())ui.month=now.getMonth();else{const ll=lastLogged();ui.month=ll>=0?ll:0}break}
    case 'income1':state.income1=Math.max(0,v||0);break;
    case 'pyfPct':state.pyfPct=clamp((v||0)/100,0,1);break;
    case 'rentLimit':state.rentLimit=clamp((v||0)/100,0,1);break;
    case 'splitPyf':state.pyfSplit[d.key]=clamp((v||0)/100,0,1);break;
    case 'splitExtra':state.extraSplit[d.key]=clamp((v||0)/100,0,1);break;
    case 'target':state.targets[d.key]=clamp((v||0)/100,0,1);break;
    case 'planned':{const l=state.lines.find(x=>x.id===d.line);if(l)l.planned=Math.max(0,v||0);break}
    case 'linePct':{const l=state.lines.find(x=>x.id===d.line);if(l)l.pctVal=clamp((v||0)/100,0,1);break}
    case 'actual':setActual(d.line,ui.month,v);break;
    case 'inc1a':yd().inc1Actual[ui.month]=v>0?v:null;break;
    case 'fundTarget':{const f=state.funds.find(x=>x.id===d.fund);if(f)f.target=Math.max(0,v||0);break}
    case 'fundOpening':{const f=state.funds.find(x=>x.id===d.fund);if(f)f.opening=v||0;break}
    case 'fundSpent':{const f=state.funds.find(x=>x.id===d.fund);if(f)yd().fundsSpent[f.id][ui.month]=v>0?v:null;break}
    case 'logDate':if(ui.modal&&t.value){const[yy,mm,dd]=t.value.split('-').map(Number);if(yy&&mm&&dd){ui.modal.year=yy;ui.modal.month=mm-1;ui.modal.day=dd;}}break;
    case 'logAmount':if(ui.modal)ui.modal.amount=v===null?'':v;break;
    case 'logNote':if(ui.modal)ui.modal.note=t.value;break;
    case 'syncUrlDraft':ui.syncUrlDraft=t.value;break;
    case 'lockP1':ui.lockP1=t.value;break;
    case 'lockP2':ui.lockP2=t.value;break;
    case 'unlockDraft':ui.unlockDraft=t.value;break;
    case 'rFrom':if(t.value)ui.rFrom=t.value;break;
    case 'rTo':if(t.value)ui.rTo=t.value;break;
  }
  /* Picking a month/year or typing in the log form only changes what's on screen here —
     it isn't budget data, so it shouldn't count as an edit or trigger a sync. */
  if(['month','year','logDate','logAmount','logNote','syncUrlDraft','lockP1','lockP2','unlockDraft','rFrom','rTo'].indexOf(act)<0)save();
  later();
}
function onClick(e){
  const el=e.target.closest('[data-click]');if(!el)return;
  const a=el.dataset.click,d=el.dataset;
  switch(a){
    case 'tab':ui.tab=d.t;ui.err=null;ui.addingTo=null;ui.confirm=null;ui.modal=null;window.scrollTo(0,0);break;
    case 'scope':ui.scope=d.s;break;
    case 'pick-month':ui.month=+d.m;ui.scope='month';break;
    case 'theme':{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(cur==='dark'?'light':'dark');break}
    case 'clear-demo':clearActuals();state.demo=false;state.resetAt=Date.now();save();break;
    case 'add-line':ui.addingTo=d.b;ui.err=null;break;
    case 'cancel-line':ui.addingTo=null;ui.err=null;break;
    case 'save-line':{
      const n=($('#al-name')||{}).value||'',p=parseNum(($('#al-amt')||{}).value);
      if(!n.trim()){ui.err='Give the line a name.';break}
      beforePlanChange();
      state.lines.splice(lastIndexOf(d.b)+1,0,{id:'c_'+Date.now().toString(36),bucket:d.b,name:n.trim(),planned:Math.max(0,p||0)});
      ui.addingTo=null;ui.err=null;save();break}
    case 'del-line':beforePlanChange();tomb('line:'+d.line);state.lines=state.lines.filter(l=>l.id!==d.line);delete ui.expandedLines[d.line];state.entries.filter(e=>e.line===d.line).forEach(e=>tomb(e.id));state.entries=state.entries.filter(e=>e.line!==d.line);save();break;
    case 'rename-line':ui.renamingLine=d.line;break;
    case 'rename-tag':ui.renamingTag={line:d.line,tag:d.tag};setTimeout(()=>{const x=$('#rt-name');if(x){x.focus();x.select()}},0);break;
    case 'cancel-tag-rename':ui.renamingTag=null;break;
    case 'save-tag-rename':{const r=ui.renamingTag,x=$('#rt-name');if(r&&x&&x.value.trim()){renameTag(r.line,r.tag,x.value);save()}ui.renamingTag=null;break}
    case 'cancel-rename':ui.renamingLine=null;break;
    case 'save-rename':{
      const l=state.lines.find(x=>x.id===ui.renamingLine);
      const box=$('#rn-'+ui.renamingLine);
      const v=box?box.value.trim():'';
      if(l&&v)l.name=v;
      ui.renamingLine=null;save();break}
    case 'line-mode':{
      const l=state.lines.find(x=>x.id===d.line);if(!l)break;
      beforePlanChange();
      if(l.mode==='pct'){l.planned=Math.round(planOf(state,l));l.mode='fixed'}
      else{l.pctVal=state.income1?num(l.planned)/state.income1:0;l.mode='pct'}
      save();break}
    case 'pick-cat':if(ui.modal){ui.modal.line=d.line;ui.modal.allTags=false;ui.modal.addingTag=false;}break;
    case 'pick-tag':if(ui.modal){ui.modal.tag=ui.modal.tag===d.tag?'':d.tag;}break;
    case 'more-tags':if(ui.modal)ui.modal.allTags=true;break;
    case 'add-tag-inline':if(ui.modal){ui.modal.addingTag=true;ui.modalErr=null;setTimeout(()=>{const x=$('#mt-name');if(x)x.focus()},0)}break;
    case 'cancel-tag-inline':if(ui.modal)ui.modal.addingTag=false;break;
    case 'save-tag-inline':{
      if(!ui.modal)break;
      const n=addTag(ui.modal.line,($('#mt-name')||{}).value||'');
      if(!n){ui.modalErr='Type the name of the shop, restaurant or website.';break}
      ui.modal.tag=n;ui.modal.addingTag=false;ui.modalErr=null;save();break}
    case 'add-cat-inline':if(ui.modal){ui.modal.addingCat=d.b;ui.modalErr=null;}break;
    case 'cancel-cat-inline':if(ui.modal){ui.modal.addingCat=null;}break;
    case 'save-cat-inline':{
      if(!ui.modal)break;
      const n=($('#mc-name')||{}).value||'';
      if(!n.trim()){ui.modalErr='Give the category a name.';break}
      const id='c_'+Date.now().toString(36);
      state.lines.splice(lastIndexOf(d.b)+1,0,{id,bucket:d.b,name:n.trim(),planned:0});
      ui.modal.line=id;ui.modal.addingCat=null;ui.modalErr=null;save();break}
    case 'add-extra':{
      const date=($('#x-date')||{}).value,amt=parseNum(($('#x-amt')||{}).value);
      if(!date){ui.err='Pick the date the money arrived.';break}
      if(!(amt>0)){ui.err='Enter an amount above zero.';break}
      state.extra.push({id:'x'+Date.now().toString(36),ts:Date.now(),date,source:($('#x-src')||{}).value||'',amount:amt,fund:($('#x-fund')||{}).value||'hol'});
      ['x-amt','x-src'].forEach(i=>{const x=$('#'+i);if(x)x.value=''}); // start the next one blank
      ui.err=null;save();break}
    case 'del-extra':tomb(d.id);state.extra=state.extra.filter(x=>x.id!==d.id);save();break;
    case 'open-log':{
      if(d.entry){
        const ex=state.entries.find(x=>x.id===d.entry);
        if(!ex)break;
        ui.modal={line:ex.line,year:ex.year,month:ex.month,day:ex.day||1,amount:ex.amount,note:ex.note||'',tag:ex.tag||'',editingId:ex.id,_fresh:true};
        ui.modalErr=null;break;
      }
      const line=d.line||(state.lines.find(l=>isItemized(l.bucket))||{}).id;
      if(!line)break;
      const today=new Date();
      const day=(ui.year===today.getFullYear()&&ui.month===today.getMonth())?today.getDate():1;
      ui.modal={line,year:ui.year,month:ui.month,day,amount:'',note:'',tag:'',editingId:null,_fresh:true};
      ui.modalErr=null;break}
    case 'close-modal':if(el!==e.target)return; /* a tap inside the sheet, not on the backdrop: nothing to do (and no redraw, which would drop a half-typed name) */
      ui.modal=null;ui.modalErr=null;break;
    case 'toggle-start':ui.startOpen=!ui.startOpen;break;
    case 'reset-month-line':setActual(d.line,ui.month,null);save();break;
    case 'toggle-weeks':ui.expandedLines[d.line]=!ui.expandedLines[d.line];break;
    case 'save-entry':{
      const md=ui.modal;if(!md)break;
      const amt=parseNum(($('#lm-amount')||{}).value);
      if(!(amt>0)){ui.modalErr='Enter an amount above zero.';break}
      const note=($('#lm-note')||{}).value||'';
      if(md.editingId){
        const ex=state.entries.find(x=>x.id===md.editingId);
        if(!ex){ui.modalErr='This expense was deleted on the other phone, so there is nothing to edit. Cancel, then log it again if you still need it.';break}
        ex.line=md.line;ex.year=md.year;ex.month=md.month;ex.day=md.day;ex.amount=amt;ex.note=note;ex.ts=Date.now();if(md.tag)ex.tag=md.tag;else delete ex.tag;
      }else{
        const nid=newEntryId();
        const ne={id:nid,ts:Date.now(),line:md.line,year:md.year,month:md.month,day:md.day,amount:amt,note};if(md.tag)ne.tag=md.tag;
        state.entries.push(ne);
        const ln=state.lines.find(l=>l.id===md.line);
        showToast(`Logged ${fmt(amt)} to ${ln?ln.name:'expense'}${md.tag?' ('+md.tag+')':''} · ${md.day} ${MONTHS[md.month]}${md.year!==ui.year?' '+md.year:''}`,nid);
      }
      ui.modal=null;ui.modalErr=null;save();break}
    case 'delete-entry':{
      if(ui.modal&&ui.modal.editingId){tomb(ui.modal.editingId);state.entries=state.entries.filter(x=>x.id!==ui.modal.editingId);}
      ui.modal=null;save();break}
    case 'undo-entry':if(ui.toast&&ui.toast.undoId){tomb(ui.toast.undoId);state.entries=state.entries.filter(x=>x.id!==ui.toast.undoId);ui.toast=null;save();}break;
    case 'ask':ui.confirm=d.id;break;
    case 'clear-actuals':clearActuals();state.demo=false;state.resetAt=Date.now();ui.confirm=null;save();break;
    case 'reset-all':{const del=Object.assign({},state.deleted);state=defaults();seedTags(state);state.deleted=del;state.resetAt=Date.now();ui.confirm=null;save();break}
    case 'connect-sync':{
      const v=extractSyncUrl(($('#sync-url')||{}).value);
      if(!v){ui.syncErr='That does not look like a setup link or an Apps Script Web App URL (it should start with https://script.google.com/ and end in /exec).';break}
      ui.syncErr=null;ui.syncUrlDraft=null;setSyncUrl(v);break}
    case 'sync-now':syncNow();break;
    case 'ov':ui.ov=d.v;break;
    case 'range':ui.range=d.r;ui.openCat=null;ui.catAll=null;
      if(d.r==='custom'&&!ui.rFrom){const t=new Date();ui.rFrom=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));ui.rTo=ymd(t)}break;
    case 'sp-cat':ui.openCat=ui.openCat===d.line?null:d.line;ui.catAll=null;break;
    case 'cat-all':ui.catAll=d.line;break;
    case 'toggle-cmp':setCmp(!getCmp());break;
    case 'lock-open':ui.lockOpen=true;ui.lockErr=null;ui.lockMsg=null;ui.confirm=null;break;
    case 'lock-cancel':ui.lockOpen=false;ui.lockErr=null;ui.lockP1=ui.lockP2='';break;
    case 'lock-set':{
      const p1=normPass(($('#lk-p1')||{}).value), p2=normPass(($('#lk-p2')||{}).value);
      if(p1.length<8){ui.lockErr='Use at least 8 characters (four random words is ideal).';break}
      if(p1!==p2){ui.lockErr="The two passphrases don't match.";break}
      if(sync.need){ui.lockErr='Unlock the budget first.';break}
      ui.lockErr=null;ui.lockMsg=null;ui.lockBusy=true;
      setPassphrase(p1).then(()=>{ui.lockBusy=false;ui.lockOpen=false;ui.lockP1=ui.lockP2='';render()},()=>{ui.lockBusy=false;ui.lockErr='Something went wrong. Try again.';render()});
      break}
    case 'lock-remove':ui.confirm=null;ui.lockMsg=null;removeLock();break;
    case 'unlock':{
      const pw=normPass(($('#unlock-pass')||{}).value);
      if(!pw){ui.unlockErr='Type the passphrase first.';break}
      ui.unlockErr=null;ui.unlockBusy=true;
      unlockWith(pw).then(ok=>{ui.unlockBusy=false;if(ok){ui.unlockDraft='';ui.unlockErr=null}else{ui.unlockErr="That passphrase doesn't open this budget. Check capital letters and spaces."}render()});
      break}

    case 'install-app':if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;later()})}break;
    case 'share-setup':{
      const link=setupLink();
      if(navigator.share){navigator.share({title:'Family Budget',text:'Open this to link the budget app on your phone:',url:link}).catch(()=>{})}
      else if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>{ui.shareMsg='Setup link copied \u2014 paste it into a private message.';render()},()=>{ui.shareMsg=link;render()})}
      else ui.shareMsg=link;
      break}
    case 'disconnect-sync':ui.confirm=null;setSyncUrl('');break;
    case 'export':ui.backup=JSON.stringify(state);ui.restoreErr=null;break;
    case 'import':{
      const box=$('#bk');
      if(ui.backup!=='paste'&&!(box&&ui.backup==='paste')){ui.backup='paste';ui.restoreErr=null;break}
      try{const s=JSON.parse((box&&box.value)||'');if(!s||s.v!==1||!Array.isArray(s.lines)||!Array.isArray(s.funds))throw 0;state=migrate(s);state.resetAt=Date.now();ui.backup='';ui.restoreErr=null;save()}
      catch(x){ui.restoreErr='That does not look like a backup from this app.'}
      break}
  }
  later();
}
/* A short confirmation after logging, with Undo — so a mis-tap on a phone is one tap to fix,
   and an expense logged to another month doesn't just silently vanish from the screen. */
let toastTimer=null;
function showToast(text,undoId){ui.toast={text,undoId};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast=null;render()},5000)}
function toastHtml(){return ui.toast?`<div class="toast" role="status">${esc(ui.toast.text)}${ui.toast.undoId?`<button class="toast-undo" data-click="undo-entry">Undo</button>`:''}</div>`:''}
/* Buttons for a category: the ones you use most first, then the starting list, then the
   everywhere ones (Shopee). */
function tagsFor(lineId){
  const del=state.deleted||{}, cnt={};
  state.entries.forEach(e=>{if(e.line===lineId&&e.tag)cnt[e.tag]=(cnt[e.tag]||0)+1});
  const used=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const out=[];
  [...used,...((state.tagLists||{})[lineId]||[]),...((state.tagLists||{})['*']||[])].forEach(t=>{
    if(!t||del['tag:'+lineId+':'+t.toLowerCase()]&&!cnt[t])return;
    if(!out.some(x=>x.toLowerCase()===t.toLowerCase()))out.push(t);
  });
  return out;
}
/* Add a new button to a category; returns the name actually used (an existing one if it
   matches apart from capitals, so "jaya grocer" doesn't become a second Jaya Grocer). */
function addTag(lineId,name){
  const n=String(name||'').trim().slice(0,30);if(!n)return '';
  const hit=tagsFor(lineId).find(t=>t.toLowerCase()===n.toLowerCase());if(hit)return hit;
  if(!state.tagLists)state.tagLists={};
  (state.tagLists[lineId]||(state.tagLists[lineId]=[])).push(n);
  if(state.deleted)delete state.deleted['tag:'+lineId+':'+n.toLowerCase()];
  return n;
}
/* Rename a tag within one category, on every expense in it, any month. Renaming to a name
   that already exists merges the two. */
function renameTag(lineId,from,to){
  const n=String(to||'').trim().slice(0,30);if(!n||n===from)return;
  const target=tagsFor(lineId).find(t=>t.toLowerCase()===n.toLowerCase()&&t!==from)||n;
  const now=Date.now();
  state.entries.forEach(e=>{if(e.line===lineId&&e.tag===from){e.tag=target;e.ts=now}});
  const L=(state.tagLists||{})[lineId]||[];
  const i=L.indexOf(from);if(i>=0)L.splice(i,1);
  if(L.indexOf(target)<0&&!((state.tagLists||{})['*']||[]).includes(target))L.push(target);
  if(!state.tagLists[lineId])state.tagLists[lineId]=L;
  if(!((state.tagLists||{})['*']||[]).includes(from))tomb('tag:'+lineId+':'+from.toLowerCase());
}
function tomb(id){if(!state.deleted)state.deleted={};state.deleted[id]=Date.now()}
function lastIndexOf(b){let i=-1;state.lines.forEach((l,k)=>{if(l.bucket===b)i=k});return i}
function clearActuals(){state.byYear={};state.entries=[];state.extra=[]}
let rt,lastW=window.innerWidth;window.addEventListener('resize',()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;clearTimeout(rt);rt=setTimeout(render,180)});
document.addEventListener('change',onChange);
document.addEventListener('click',onClick);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='unlock-pass'){e.preventDefault();const b=document.querySelector('[data-click="unlock"]');if(b)b.click();}
  if(e.key==='Enter'&&e.target.id==='lk-p2'){e.preventDefault();const b=document.querySelector('[data-click="lock-set"]');if(b)b.click();}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('num'))e.target.blur();
  /* In the log form, the keyboard's Enter/"Go" key saves, so a quick log is: type, Enter. */
  if(ui.modal&&e.key==='Enter'&&(e.target.id==='lm-amount'||e.target.id==='lm-note')){
    e.preventDefault();const b=document.querySelector('[data-click="save-entry"]');if(b)b.click();
  }
  if(e.target.id==='rt-name'){
    if(e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-click="save-tag-rename"]');if(b)b.click();}
    else if(e.key==='Escape'){ui.renamingTag=null;later();}
  }
  if(ui.modal&&e.key==='Enter'&&e.target.id==='mt-name'){
    e.preventDefault();const b=document.querySelector('[data-click="save-tag-inline"]');if(b)b.click();
  }
  if(ui.modal&&e.key==='Enter'&&e.target.id==='mc-name'){
    e.preventDefault();const b=document.querySelector('[data-click="save-cat-inline"]');if(b)b.click();
  }
  if(ui.modal&&e.key==='Escape'&&!(e.target.id&&e.target.id.indexOf('rn-')===0)){ui.modal=null;ui.modalErr=null;later();}
  if(e.target.id&&e.target.id.indexOf('rn-')===0){
    if(e.key==='Enter'){
      e.preventDefault();
      const l=state.lines.find(x=>x.id===ui.renamingLine);
      const v=e.target.value.trim();
      if(l&&v)l.name=v;
      ui.renamingLine=null;save();
    }else if(e.key==='Escape'){ui.renamingLine=null;later();}
  }
});

/* ------------------------------------------------------------------ boot */
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOk=false}
state=load();
if(!state){state=defaults();applyDemo(state);localSave()}
seedTags(state);
/* Always open on today's month: that's where a quick "log an expense" should land. */
ui.month=new Date().getMonth();
render();
/* Opened from a setup link? Link this phone, then tidy the address bar. */
/* Also when a setup link is opened in a tab that already has the app open. */
window.addEventListener('hashchange',()=>{
  const u=extractSyncUrl(location.hash);if(!u)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(u!==sync.url){ui.tab='budget';setSyncUrl(u)}
});
(function(){
  const fromLink=extractSyncUrl(location.hash);
  if(fromLink){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(fromLink!==sync.url){setSyncUrl(fromLink);ui.tab='budget';return}
  }
  if(sync.url){syncNow().then(()=>startPolling())}
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
</script>
